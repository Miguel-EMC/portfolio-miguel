<div class="language-switch" role="group" [attr.aria-label]="currentLanguage === 'es' ? 'Idioma del sitio' : 'Website language'">
  <button type="button" (click)="onLanguageChange('es')" [class.active]="currentLanguage === 'es'" [attr.aria-pressed]="currentLanguage === 'es'" aria-label="Español" title="Español" lang="es">ES</button>
  <button type="button" (click)="onLanguageChange('en')" [class.active]="currentLanguage === 'en'" [attr.aria-pressed]="currentLanguage === 'en'" aria-label="English" title="English" lang="en">EN</button>
</div>
