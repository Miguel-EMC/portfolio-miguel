<nav class="navbar" [ngClass]="{'scrolled': isScrolled, 'open': isMobileMenuOpen}">
  <div class="nav-container">
    <!-- Brand -->
    <div class="nav-brand">
      <a routerLink="/home" class="brand-link">
        <span class="brand-logo">M</span>
        <div class="brand-text">
          <span class="brand-name">EMCode</span>
          <span class="brand-tagline">Software Developer</span>
        </div>
      </a>
    </div>

    <!-- Desktop Navigation -->
    <div class="nav-links desktop-nav">
      <a class="nav-link" routerLink="/home" [class.active]="isActive('home')">
        Inicio
      </a>
      <a class="nav-link" routerLink="/resume" [class.active]="isActive('/resume')">
        Resume
      </a>
      <a class="nav-link" routerLink="/portfolio" [class.active]="isActive('/portfolio')">
        Portafolio
      </a>
      <a class="nav-link" routerLink="/contact" [class.active]="isActive('/contact')">
        Contacto
      </a>
    </div>

    <!-- Controls -->
    <div class="nav-right">
      <div class="nav-controls">
        <app-language-toggle></app-language-toggle>
      </div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Menú">
        <div class="hamburger" [class.active]="isMobileMenuOpen">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <div class="mobile-menu-content">
      <a class="nav-link" routerLink="/home" [class.active]="isActive('home')" (click)="closeMobileMenu()">
        <i class="bi bi-house-fill"></i> Inicio
      </a>
      <a class="nav-link" routerLink="/resume" [class.active]="isActive('/resume')" (click)="closeMobileMenu()">
        <i class="bi bi-file-person-fill"></i> Resume
      </a>
      <a class="nav-link" routerLink="/portfolio" [class.active]="isActive('/portfolio')" (click)="closeMobileMenu()">
        <i class="bi bi-collection-fill"></i> Portafolio
      </a>
      <a class="nav-link" routerLink="/contact" [class.active]="isActive('/contact')" (click)="closeMobileMenu()">
        <i class="bi bi-envelope-fill"></i> Contacto
      </a>
    </div>
  </div>
</nav>
