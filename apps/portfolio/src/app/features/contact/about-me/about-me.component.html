<section class="about-section">
  <div class="container">
    <header class="section-header">
      <span class="section-eyebrow">EMCODE · QUITO, ECUADOR</span>
      <h1 class="section-title">{{ "ui.aboutTitle" | translate }}</h1>
      <p class="section-subtitle">{{ "home.hero.description" | translate }}</p>
    </header>
    <div class="about-content">
      <img
        src="/assets/img/logo-avatar.png"
        alt="Miguel Muzo"
        width="260"
        height="260"
      />
      <div>
        <h2>Software Developer</h2>
        <p>{{ "ui.aboutBody" | translate }}</p>
        <a routerLink="/resume" class="btn-secondary">{{
          "ui.exploreCareer" | translate
        }}</a
        ><a routerLink="/contact" class="btn-primary">{{
          "nav.contact" | translate
        }}</a>
      </div>
    </div>
    <h2 class="skills-heading">{{ "ui.skillTitle" | translate }}</h2>
    <app-skills />
  </div>
</section>
