<div class="skills-grid">
  <article
    class="skill-group"
    *ngFor="let group of skillCategories; let i = index"
  >
    <div class="skill-marker">
      <span>{{ (i + 1).toString().padStart(2, "0") }}</span
      ><i class="bi bi-arrow-up-right" aria-hidden="true"></i>
    </div>
    <h3>{{ "ui.skills." + group.id + ".title" | translate }}</h3>
    <p>{{ "ui.skills." + group.id + ".description" | translate }}</p>
    <div class="technology-list">
      <span class="technology-chip" *ngFor="let skill of group.skills"
        ><span class="technology-icon" aria-hidden="true"
          ><img
            *ngIf="skill.icon"
            [src]="skill.icon"
            alt=""
            width="20"
            height="20"
            loading="lazy" /><i
            *ngIf="skill.symbol"
            [class]="'bi ' + skill.symbol"
          ></i></span
        ><span class="technology-name">{{ skill.name }}</span></span
      >
    </div>
  </article>
</div>
